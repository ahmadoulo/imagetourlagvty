version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: imagetourl_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: imagetourl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: imagetourl_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Wait for minio and create buckets
  minio-createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/images --ignore-existing;
      /usr/bin/mc mb myminio/thumbnails --ignore-existing;
      /usr/bin/mc policy set public myminio/images;
      /usr/bin/mc policy set public myminio/thumbnails;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imagetourl_app
    ports:
      - "3010:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/imagetourl?schema=public
      - BETTER_AUTH_SECRET=supersecret1234567890
      - BETTER_AUTH_URL=http://localhost:3000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=admin
      - S3_SECRET_ACCESS_KEY=password
      - S3_REGION=us-east-1
      - S3_BUCKET_IMAGES=images
      - S3_BUCKET_THUMBNAILS=thumbnails
      - S3_PUBLIC_URL=http://localhost:9000/images
    depends_on:
      - db
      - minio
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
